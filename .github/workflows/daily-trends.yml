name: Daily Google Trends Fetch

on:
  schedule:
    # 매일 한국시간 오전 8시 = UTC 전날 23:00
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  fetch-trends:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install pytrends pandas

      - name: 트렌드 데이터 수집
        run: python fetch_trends.py

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --quiet --cached || git commit -m "chore: daily trends update $(date +'%Y-%m-%d')"
          git push
